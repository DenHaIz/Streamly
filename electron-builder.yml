appId: com.streamly.app
productName: Streamly
copyright: Copyright © 2026 DenHaIz
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/icon.png
  - package.json
extraResources:
  # Apollo (установщик хоста) и портативный Moonlight; см. scripts/fetch-vendor.mjs
  - from: vendor
    to: vendor
    filter: ['**/*']
  - from: LICENSE
    to: LICENSE.txt
  - from: vendor.lock.json
    to: vendor.lock.json
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  # Имя без пробелов: GitHub заменяет пробелы в именах файлов релиза, и автообновление не нашло бы установщик.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Streamly
  installerLanguages: [ru_RU, en_US]
  language: '1049'
npmRebuild: false
# Ссылки-приглашения streamly://join/... открывают Streamly.
protocols:
  - name: Streamly invite
    schemes: [streamly]
# Автообновление: electron-builder кладёт рядом с установщиком latest.yml и .blockmap (загружаются в релиз
# скриптом scripts/release.mjs), а в приложение — app-update.yml с этим адресом. Публикует не electron-builder (-p never).
publish:
  provider: github
  owner: DenHaIz
  repo: Streamly
  releaseType: release
